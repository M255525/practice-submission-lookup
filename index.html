<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課堂練習存摺｜跨境電子商務</title>
<meta name="description" content="跨境電子商務課程｜輸入學號，查詢老師已登錄的課堂練習紀錄與累計練習數量">
<meta name="theme-color" content="#2f6f5e">
<meta property="og:title" content="課堂練習存摺｜跨境電子商務">
<meta property="og:description" content="跨境電子商務課程｜輸入學號，查詢老師已登錄的課堂練習紀錄與累計練習數量">
<meta property="og:type" content="website">
<meta property="og:image" content="https://m255525.github.io/practice-submission-lookup/icons/icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --ink: #1f2933;
    --muted: #66717d;
    --line: #e3dfd6;
    --accent: #2f6f5e;
    --accent-soft: #e4f0eb;
    --warn: #9a5b13;
    --warn-soft: #fbf0e1;
    --err: #a83a32;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161a1d;
      --card: #1f2428;
      --ink: #e7eaec;
      --muted: #9aa5ae;
      --line: #2f363b;
      --accent: #6cc3a6;
      --accent-soft: #1f3a32;
      --warn: #e2a65a;
      --warn-soft: #3a2c1a;
      --err: #f08a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 56px; }
  .course { display: inline-block; margin: 0 0 6px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 12px; font-size: .85rem; font-weight: 600; }
  header h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: .02em; }
  header p { margin: 0; color: var(--muted); }
  header a { color: var(--accent); }

  form {
    display: flex; gap: 8px; margin: 24px 0 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px;
  }
  input {
    flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink);
    font-size: 1.15rem; padding: 10px 12px; letter-spacing: .08em; outline: none;
  }
  button {
    border: 0; border-radius: 8px; background: var(--accent); color: #fff;
    font-size: 1rem; font-weight: 600; padding: 10px 22px; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { button { color: #10201b; } }
  button:disabled { opacity: .55; cursor: wait; }
  .hint { color: var(--muted); font-size: .88rem; margin: 0 4px; }

  #status { margin: 20px 0 0; }
  .msg { padding: 14px 16px; border-radius: 10px; }
  .msg.err { background: var(--warn-soft); color: var(--err); }
  .msg.empty { background: var(--warn-soft); color: var(--warn); }

  .summary {
    display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0 12px;
  }
  .stat {
    flex: 1 1 140px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 16px;
  }
  .stat b { display: block; font-size: 1.7rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: .85rem; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
  .chip { background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 12px; font-size: .85rem; }

  .modes { display: flex; gap: 4px; margin: 24px 0 -16px; }
  .modes button {
    background: transparent; color: var(--muted); font-weight: 600; font-size: .95rem;
    padding: 6px 14px; border-radius: 8px 8px 0 0; border-bottom: 2px solid transparent;
  }
  .modes button[aria-selected=true] { color: var(--accent); border-bottom-color: var(--accent); }
  @media (prefers-color-scheme: dark) { .modes button { color: var(--muted); } .modes button[aria-selected=true] { color: var(--accent); } }
  .mem {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px; margin-bottom: 8px;
  }
  .mem.self { border-left: 4px solid var(--accent); }
  .mem .who { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .mem .who b { font-size: 1.05rem; }
  .mem .who span { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  .mem .who .sum { margin-left: auto; color: var(--ink); }
  .mem .tools { margin: 8px 0 0; }
  .grp { font-size: 1.2rem; margin: 20px 0 10px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .grp span { font-size: .9rem; font-weight: 400; color: var(--muted); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; margin: 0 0 14px; }
  form[hidden], .hint[hidden] { display: none; }
  form[hidden] + .hint + #status { margin-top: 32px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
  .kpi span { display: block; color: var(--muted); font-size: .82rem; }
  .kpi b { display: block; font-size: 1.5rem; line-height: 1.25; font-variant-numeric: tabular-nums; }
  .kpi small { color: var(--muted); font-size: .8rem; }
  .meter { height: 6px; background: var(--line); border-radius: 4px; margin-top: 8px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .missing { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin: 0 0 16px; font-size: .92rem; }
  .missing.ok { background: var(--accent-soft); color: var(--accent); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 0 0 14px; }
  .panel h2 { font-size: 1.05rem; margin: 0 0 4px; }
  .panel .sub { color: var(--muted); font-size: .82rem; margin: 0 0 10px; }
  .bar { display: grid; grid-template-columns: minmax(0, 11em) 1fr auto; align-items: center; gap: 4px 10px; padding: 5px 0; }
  .bar .lbl { font-size: .9rem; overflow-wrap: anywhere; }
  .bar .lbl small { display: block; color: var(--muted); font-size: .76rem; }
  .bar .val { font-size: .88rem; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .bar .meter { margin: 0; height: 10px; }
  .bar:hover .meter i { filter: brightness(1.12); }
  @media (max-width: 480px) { .bar { grid-template-columns: 1fr auto; } .bar .meter { grid-column: 1 / -1; grid-row: 2; } }
  .rec {
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
  }
  .rec h3 { margin: 0; font-size: 1.05rem; }
  .rec .topic { margin: 2px 0 8px; color: var(--ink); overflow-wrap: anywhere; }
  .rec dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 4px 16px; margin: 0; }
  .rec dt { color: var(--muted); font-size: .78rem; }
  .rec dd { margin: 0 0 4px; font-variant-numeric: tabular-nums; }

  #notice {
    margin-top: 28px; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 20px; font-size: .92rem;
  }
  #notice h2 { font-size: 1.05rem; margin: 0 0 8px; }
  #notice p { margin: 6px 0; }
  #notice p.sub { font-weight: 700; margin-top: 12px; }
  footer { margin-top: 32px; color: var(--muted); font-size: .8rem; text-align: center; }
  footer p { margin: 4px 0; }
  footer a { color: var(--accent); }
  footer img { vertical-align: middle; margin-top: 6px; }

  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .top-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .ghost {
    background: var(--card); color: var(--ink); border: 1px solid var(--line);
    font-weight: 500; font-size: .85rem; padding: 6px 12px;
  }
  @media (prefers-color-scheme: dark) { .ghost { color: var(--ink); } }
  #settings {
    margin: 16px 0 0; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 16px; font-size: .92rem;
  }
  #settings h2 { font-size: 1rem; margin: 0 0 8px; }
  #settings label { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; }
  #settings input[type=checkbox] { flex: none; width: 18px; height: 18px; accent-color: var(--accent); }
  #settings .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  #settings .row span { color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border-radius: 0; background: transparent; color: var(--ink); font-weight: 500; padding: 4px 12px; font-size: .85rem; }
  .seg button[aria-pressed=true] { background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .seg button[aria-pressed=true] { color: #10201b; } }
  #settings .small { color: var(--muted); font-size: .8rem; margin: 6px 0 0; }
  body.fs-l { font-size: 112.5%; }
  body.fs-xl { font-size: 125%; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 4000; max-width: 90vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #marqueeBar{position:fixed;top:0;left:0;right:0;height:30px;background:var(--card);border-bottom:1px solid var(--line);z-index:2100;overflow:hidden;display:none;align-items:center;}
  #marqueeBar.show{display:flex;}
  #marqueeTrack{white-space:nowrap;display:inline-block;padding-left:100%;animation:marquee-scroll linear infinite;font-size:13px;color:var(--muted);}
  #marqueeBar:hover #marqueeTrack{animation-play-state:paused}
  @keyframes marquee-scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
  body.has-marquee{padding-top:30px;}
  @media (max-width: 480px) { .top-actions .lbl { display: none; } }
</style>
</head>
<body>
<div id="marqueeBar"><div id="marqueeTrack"></div></div>
<main>
  <header class="topbar">
    <div>
      <span class="course">跨境電子商務課程</span>
      <h1>課堂練習存摺</h1>
      <p>輸入學號，查看老師已登錄的課堂練習紀錄與累計數量。 <a href="manual.html">使用說明</a></p>
    </div>
    <div class="top-actions">
      <button class="ghost" id="installBtn" type="button" title="加入主畫面">📲<span class="lbl"> 加入主畫面</span></button>
      <button class="ghost" id="settingsBtn" type="button" aria-expanded="false" aria-controls="settings" title="設定">⚙<span class="lbl"> 設定</span></button>
    </div>
  </header>

  <section id="settings" hidden>
    <h2>常用設定</h2>
    <label><input type="checkbox" id="optRemember"> 在這台裝置記住我的學號</label>
    <label><input type="checkbox" id="optAuto"> 開啟頁面時自動查詢（需先記住學號）</label>
    <div class="row">
      <span>字體大小</span>
      <div class="seg" role="group" aria-label="字體大小">
        <button type="button" data-fs="">標準</button>
        <button type="button" data-fs="fs-l">大</button>
        <button type="button" data-fs="fs-xl">特大</button>
      </div>
      <button class="ghost" id="clearBtn" type="button">清除本機資料</button>
    </div>
    <p class="small">在電腦教室或共用電腦上查詢，建議取消「記住學號」，用完按「清除本機資料」。設定只存在這台裝置的瀏覽器。</p>
  </section>

  <div class="modes" role="tablist" aria-label="查詢方式">
    <button type="button" role="tab" data-mode="me" aria-selected="true">個人查詢</button>
    <button type="button" role="tab" data-mode="group" aria-selected="false">組別查詢</button>
    <button type="button" role="tab" data-mode="stats" aria-selected="false">繳交分析</button>
  </div>
  <form id="form" autocomplete="off">
    <input id="sid" inputmode="numeric" placeholder="請輸入學號" aria-label="學號" maxlength="20" required>
    <button id="btn" type="submit">查詢</button>
  </form>
  <p class="hint" id="hint">為保護個資，姓名只顯示部分字元；查詢結果不含上傳的圖片。</p>

  <section id="status" aria-live="polite"></section>
  <section id="notice" hidden></section>

  <footer>
    <p>資料來源：課堂 LINE 記事本練習證明（OCR 辨識後登錄）</p>
    <p>製作：Mark Tsai（蔡豐全）｜<a href="mailto:tsaimark@gmail.com">tsaimark@gmail.com</a>｜<a href="manual.html#creator">創作者資料</a>｜<a href="manual.html">使用說明</a></p>
    <img src="https://visitor-badge.laobi.icu/badge?page_id=m255525.practicesubmissionlookup" alt="訪客次數" height="20">
  </footer>
</main>
<div id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzN8EP6-WxHqmXSRPhG-X5bDD-LWbYCsH5Ddg0mYLDaKo4rdZGw_CqBbugBUW6hCPBC/exec';
const LS_KEY = 'practiceLookup.sid';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// 常用設定：記住學號（預設開，維持原行為）、開頁自動查詢、字體大小
const SET_KEY = 'practiceLookup.settings';
let settings = { remember: true, auto: false, fs: '' };
try { Object.assign(settings, JSON.parse(localStorage.getItem(SET_KEY) || '{}')); } catch (e) {}
const saveSettings = () => { try { localStorage.setItem(SET_KEY, JSON.stringify(settings)); } catch (e) {} };

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}

function applySettings() {
  $('optRemember').checked = settings.remember;
  $('optAuto').checked = settings.auto;
  $('optAuto').disabled = !settings.remember;
  document.body.classList.remove('fs-l', 'fs-xl');
  if (settings.fs) document.body.classList.add(settings.fs);
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.fs === settings.fs)));
}

$('settingsBtn').addEventListener('click', () => {
  const open = $('settings').hidden;
  $('settings').hidden = !open;
  $('settingsBtn').setAttribute('aria-expanded', String(open));
});
$('optRemember').addEventListener('change', e => {
  settings.remember = e.target.checked;
  if (!settings.remember) {
    settings.auto = false;
    try { localStorage.removeItem(LS_KEY); } catch (err) {}
  }
  saveSettings(); applySettings();
  toast(settings.remember ? '下次查詢後會記住學號' : '已不再記住學號');
});
$('optAuto').addEventListener('change', e => { settings.auto = e.target.checked; saveSettings(); });
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  settings.fs = b.dataset.fs; saveSettings(); applySettings();
}));
$('clearBtn').addEventListener('click', () => {
  try { localStorage.removeItem(LS_KEY); localStorage.removeItem(SET_KEY); } catch (e) {}
  settings = { remember: true, auto: false, fs: '' };
  applySettings();
  $('sid').value = '';
  $('status').innerHTML = '';
  $('notice').hidden = true;
  toast('已清除這台裝置上的學號與設定');
});

applySettings();
if (settings.remember) { try { $('sid').value = localStorage.getItem(LS_KEY) || ''; } catch (e) {} }

// Apps Script 偶爾卡住約 30 秒後回 404：25 秒逾時就中止重送一次
async function fetchJson(url, tries = 2, timeoutMs = 25000) {
  for (let i = 1; ; i++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } catch (e) {
      if (i >= tries) throw e;
    } finally {
      clearTimeout(timer);
    }
  }
}

// 開頁先預熱，讓後端快取好資料，學生按查詢時比較快
fetch(API_URL + '?action=notice').catch(() => {});

function showNotice(lines) {
  if (!lines || !lines.length) return;
  const [title, ...rest] = lines;
  $('notice').innerHTML = '<h2>' + esc(title) + '</h2>' +
    rest.map(t => '<p' + (/^[一二三四五六七八九十]+、/.test(t) ? ' class="sub"' : '') + '>' + esc(t) + '</p>').join('');
  $('notice').hidden = false;
}

function render(data) {
  if (!data.ok) {
    $('status').innerHTML = '<div class="msg err">' + esc(data.error || '查詢失敗，請稍後再試') + '</div>';
    return;
  }
  if (!data.count) {
    $('status').innerHTML = '<div class="msg empty">查無學號 <b>' + esc(data.sid) +
      '</b> 的練習紀錄。可能是尚未登錄、圖片辨識失敗，或學號辨識有誤，請於上課期間向老師反映。</div>';
    showNotice(data.notice);
    return;
  }
  $('notice').hidden = true;
  const r0 = data.records[0];
  const chips = Object.entries(data.byTool)
    .map(([tool, n]) => '<span class="chip">' + esc(tool) + ' × ' + n + '</span>').join('');
  const cards = data.records.map(r => `
    <article class="rec">
      <h3>${esc(r.tool || '（未辨識工具）')}</h3>
      <p class="topic">${r.topic ? '「' + esc(r.topic) + '」' : '（未辨識主題）'}</p>
      <dl>
        <div><dt>練習數量</dt><dd>${esc(r.qty || '—')}</dd></div>
        <div><dt>產出日期</dt><dd>${esc(r.date || '—')}</dd></div>
        <div><dt>上課批次</dt><dd>${esc(r.batch || '—')}</dd></div>
        <div><dt>組別</dt><dd>${esc(r.group || '—')}</dd></div>
        <div><dt>登錄時間</dt><dd>${esc(r.loggedAt || '—')}</dd></div>
      </dl>
    </article>`).join('');
  $('status').innerHTML = `
    <div class="summary">
      <div class="stat"><b>${esc(r0.name || '—')}</b><span>${esc(r0.dept)}｜${esc(data.sid)}</span></div>
      <div class="stat"><b>${data.count}</b><span>已登錄練習（筆）</span></div>
      <div class="stat"><b>${data.totalQty}</b><span>累計練習數量</span></div>
    </div>
    ${kpiHtml(data.kpi)}
    <div class="tools">${chips}</div>
    ${cards}`;
}

const pct = x => Math.round((x || 0) * 100) + '%';
const fmtBatch = b => /^\d{8}$/.test(b) ? b.slice(4, 6) + '/' + b.slice(6) : b;
const meter = x => '<div class="meter"><i style="width:' + Math.min(100, Math.round((x || 0) * 100)) + '%"></i></div>';

function kpiHtml(k) {
  if (!k) return '';
  const diff = k.classAvgQty ? '班平均 ' + Math.round(k.classAvgQty) : '';
  const miss = k.missing.length
    ? '<div class="missing">⚠ 尚未登錄的場次：' + k.missing.map(m => esc(fmtBatch(m.batch)) + (m.tool ? '（' + esc(m.tool) + '）' : '')).join('、') +
      '。如已繳交仍未出現，請向老師反映。</div>'
    : '<div class="missing ok">✔ 目前所有上課場次都有登錄紀錄</div>';
  return `
    <div class="kpis">
      <div class="kpi"><span>繳交率</span><b>${pct(k.rate)}</b><small>${k.submitted} / ${k.sessions} 場</small>${meter(k.rate)}</div>
      <div class="kpi"><span>工具完成</span><b>${k.toolsDone} / ${k.toolsAll}</b><small>課堂練習工具</small>${meter(k.toolsAll ? k.toolsDone / k.toolsAll : 0)}</div>
      <div class="kpi"><span>練習數量 PR 值</span><b>${k.pr}</b><small>勝過約 ${k.pr}% 同學・${diff}</small>${meter(k.pr / 100)}</div>
      <div class="kpi"><span>連續繳交</span><b>${k.streak} 場</b><small>從最近一場往回算</small></div>
    </div>
    ${miss}`;
}

function renderStats(d) {
  if (!d.ok) return render(d);
  const bar = (lbl, x, val, tip) =>
    `<div class="bar" title="${esc(tip)}"><div class="lbl">${lbl}</div>${meter(x)}<div class="val">${val}</div></div>`;
  const sessions = d.sessionList.map(s => bar(
    esc(fmtBatch(s.batch)) + '<small>' + esc(s.tool || '（未辨識工具）') + '</small>',
    s.rate, s.submitted + ' 人・' + pct(s.rate),
    fmtBatch(s.batch) + ' ' + (s.tool || '') + '：' + s.submitted + ' / ' + d.students + ' 人繳交，累計數量 ' + s.qty +
      (s.noQty ? '（' + s.noQty + ' 筆未登錄數量）' : '')
  )).join('');
  const maxDist = Math.max(1, ...d.distribution);
  const dist = d.distribution.map((n, i) => ({ n, i })).reverse().filter(x => x.i > 0).map(x => bar(
    '繳交 ' + x.i + ' 場' + (x.i === d.sessions ? '<small>全勤</small>' : ''),
    x.n / maxDist, x.n + ' 人', '繳交 ' + x.i + ' / ' + d.sessions + ' 場：' + x.n + ' 人（' + pct(x.n / d.students) + '）'
  )).join('');
  const groups = d.groups.map(g => bar(
    (g.group === '未填' ? '未填組別' : '第 ' + esc(g.group) + ' 組') + '<small>' + g.members + ' 人・累計 ' + g.qty + '</small>',
    g.rate, pct(g.rate),
    (g.group === '未填' ? '未填組別' : '第 ' + g.group + ' 組') + '：' + g.members + ' 人共繳交 ' + g.submitted + ' / ' + (g.members * d.sessions) + ' 場次'
  )).join('');
  const low = d.sessionList.filter(s => s.rate < d.avgRate).map(s => fmtBatch(s.batch));
  $('status').innerHTML = `
    <div class="kpis">
      <div class="kpi"><span>已登錄學員</span><b>${d.students}</b><small>至少繳交 1 場</small></div>
      <div class="kpi"><span>上課場次</span><b>${d.sessions}</b><small>共 ${d.rows} 筆紀錄</small></div>
      <div class="kpi"><span>平均繳交率</span><b>${pct(d.avgRate)}</b>${meter(d.avgRate)}</div>
      <div class="kpi"><span>全勤人數</span><b>${d.fullAttendance}</b><small>佔 ${pct(d.students ? d.fullAttendance / d.students : 0)}</small></div>
      <div class="kpi"><span>全班累計數量</span><b>${d.totalQty}</b><small>人均 ${d.students ? Math.round(d.totalQty / d.students) : 0}</small></div>
    </div>
    <section class="panel"><h2>各場次繳交率</h2>
      <p class="sub">分母為已登錄學員 ${d.students} 人${low.length ? '；低於平均的場次：' + esc(low.join('、')) : ''}</p>${sessions}</section>
    <section class="panel"><h2>繳交場次分布</h2>
      <p class="sub">每位學員已登錄幾場（共 ${d.sessions} 場）</p>${dist}</section>
    <section class="panel"><h2>各組繳交率</h2>
      <p class="sub">組員實際繳交場次 ÷（組員人數 × 上課場次）</p>${groups}</section>
    <p class="hint">分析只顯示彙總數字，不含任何姓名或學號；從未繳交過的同學不在資料中，因此不計入分母。資料最多延遲 5 分鐘。</p>`;
}

async function loadStats() {
  $('status').innerHTML = '<div class="msg empty">正在彙整全班繳交狀況…</div>';
  try { renderStats(await fetchJson(API_URL + '?action=stats')); }
  catch (e) { render({ ok: false, error: '無法連線到查詢服務，請檢查網路後再試一次' }); }
}

function renderGroup(data) {
  if (!data.ok) return render(data);
  $('notice').hidden = true;
  const cards = data.members.map(m => {
    const chips = Object.entries(m.tools)
      .map(([tool, n]) => '<span class="chip">' + esc(tool) + ' × ' + n + '</span>').join('');
    return `
    <article class="mem${m.self ? ' self' : ''}">
      <div class="who"><b>${esc(m.name || '—')}${m.self ? '（你）' : ''}</b>
        <span>${esc(m.dept || '')}｜${esc(m.sid)}</span>
        <span class="sum">${m.count} 筆・共 ${m.totalQty}</span></div>
      <div class="tools">${chips}</div>
    </article>`;
  }).join('');
  $('status').innerHTML = `
    <h2 class="grp">第 ${esc(data.group)} 組<span>${data.memberCount} 位組員・全組累計 ${data.totalQty}</span></h2>
    ${cards}`;
}

let mode = 'me';
document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => {
  mode = b.dataset.mode;
  document.querySelectorAll('.modes button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  $('sid').placeholder = mode === 'group' ? '輸入你的學號，查看同組組員' : '請輸入學號';
  $('form').hidden = $('hint').hidden = mode === 'stats';
  $('status').innerHTML = '';
  $('notice').hidden = true;
  if (mode === 'stats') loadStats();
}));

$('form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const sid = $('sid').value.trim();
  if (!sid) return;
  if (settings.remember) { try { localStorage.setItem(LS_KEY, sid); } catch (e) {} }
  $('btn').disabled = true;
  $('btn').textContent = '查詢中…';
  $('status').innerHTML = '';
  $('notice').hidden = true;
  const slow = setTimeout(() => {
    $('status').innerHTML = '<div class="msg empty">查詢服務回應較慢，請稍候，不需要重新整理…</div>';
  }, 5000);
  try {
    if (mode === 'group') renderGroup(await fetchJson(API_URL + '?action=group&sid=' + encodeURIComponent(sid)));
    else render(await fetchJson(API_URL + '?sid=' + encodeURIComponent(sid)));
  } catch (e) {
    render({ ok: false, error: '無法連線到查詢服務，請檢查網路後再試一次' });
  } finally {
    clearTimeout(slow);
    $('btn').disabled = false;
    $('btn').textContent = '查詢';
  }
});

if (settings.remember && settings.auto && $('sid').value) $('form').requestSubmit();
</script>

<script>
/* ================= 頂部跑馬燈（獨立運作，共用工作區既有的公告 Google Sheet） ================= */
(function () {
  "use strict";
  var MARQUEE_CHECK_URL = "https://script.google.com/macros/s/AKfycbwKX0DNNbY8y4nf90BFTHtxgfqJcHHcZasRrgycl4QAe52_hkjMWSkYk4xOsqU-JPCROw/exec";
  var STORAGE_KEY = "practiceLookupMarquee";
  var REFRESH_MS = 20 * 60 * 1000;

  var bar = document.getElementById("marqueeBar");
  var track = document.getElementById("marqueeTrack");
  var lastKey = null;

  function loadCache() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); } catch (e) { return []; }
  }
  function saveCache(items) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch (e) {}
  }
  function appendParsedText(container, text) {
    var re = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
    var lastIndex = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > lastIndex) container.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
      var a = document.createElement("a");
      a.href = m[2];
      a.textContent = m[1];
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.style.color = "inherit";
      a.style.textDecoration = "underline";
      container.appendChild(a);
      lastIndex = re.lastIndex;
    }
    if (lastIndex < text.length) container.appendChild(document.createTextNode(text.slice(lastIndex)));
  }
  function buildTrackContent(items) {
    var frag = document.createDocumentFragment();
    function appendPass() {
      items.forEach(function (item, idx) {
        if (idx > 0) frag.appendChild(document.createTextNode("　★　"));
        appendParsedText(frag, item);
      });
    }
    appendPass();
    frag.appendChild(document.createTextNode("　★　"));
    appendPass();
    return frag;
  }
  function render(items) {
    if (!items || !items.length) return;
    var key = JSON.stringify(items);
    if (key === lastKey) return;
    lastKey = key;
    track.innerHTML = "";
    track.appendChild(buildTrackContent(items));
    bar.classList.add("show");
    document.body.classList.add("has-marquee");
    var width = track.scrollWidth / 2;
    track.style.animationDuration = Math.max(width / 80, 10) + "s";
  }
  function fetchMarquee() {
    fetch(MARQUEE_CHECK_URL, { method: "POST", body: JSON.stringify({ serial: "" }) })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && Array.isArray(data.marquee) && data.marquee.length) {
          saveCache(data.marquee);
          render(data.marquee);
        }
      })
      .catch(function () {});
  }

  render(loadCache());
  fetchMarquee();
  setInterval(fetchMarquee, REFRESH_MS);
})();
</script>

<script>
/* ================= PWA 加入主畫面（獨立運作） ================= */
(function () {
  "use strict";
  var deferredPrompt = null;
  var btn = document.getElementById("installBtn");
  var ua = navigator.userAgent || "";
  var isIOSDevice = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isMacDesktop = /Macintosh/.test(ua) && !isIOSDevice;
  var isSafariEngine = /^((?!chrome|crios|fxios|edgios|android).)*safari/i.test(ua);
  var isStandalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;

  function fallbackMessage() {
    if (isIOSDevice) return "請點畫面上的「分享」圖示，選「加入主畫面」";
    if (isMacDesktop && isSafariEngine) return "請用選單列「檔案」→「加入 Dock」（Safari 17 以上）";
    return "目前瀏覽器不支援安裝，或已安裝過";
  }

  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferredPrompt = e; });
  window.addEventListener("appinstalled", function () { deferredPrompt = null; });

  if (btn) {
    if (isStandalone) { btn.style.display = "none"; }
    else {
      btn.addEventListener("click", function () {
        if (!deferredPrompt) { toast(fallbackMessage()); return; }
        try { deferredPrompt.prompt(); deferredPrompt.userChoice.then(function () { deferredPrompt = null; }); }
        catch (e) { toast(fallbackMessage()); }
      });
    }
  }
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("service-worker.js").catch(function () {}); });
  }
})();
</script>
